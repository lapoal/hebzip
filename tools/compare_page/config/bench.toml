# ------------------------------------------------------------------ paq8px (optional: --paq8px PATH)
[[rows]]
id = "paq8px_8L"
label = "paq8px v217 -8L"
kind = "command"
ours = false
timeout_s = 1800
header_bytes = 9                 # paq8px archive header with the LSTM flag (paq8px.cpp)
languages = ["he", "en"]
prior = "none (its models, LSTM included, start empty and learn from the text)"
needs = "paq8px"
[rows.options]
version = "paq8px v217, -8L"
cwd = "{work}"
compress = ["{paq8px}", "-8L", "{in}", "{out}"]
decompress = ["{paq8px}", "-d", "{in}", "{out}"]
memory_mb = 2300                 # -8L reserves ~2.2 GB; the row says "not enough memory" instead of starting
memory_words = ["memory", "alloc"]

[[rows]]
id = "paq8px_8LT"
label = "paq8px v217 -8LT"
kind = "command"
ours = false
timeout_s = 1800
header_bytes = 9
languages = ["en"]
prior = "English dictionary + word embeddings for its text transform (english.dic / .exp / .emb - sizes in the summary)"
needs = "paq8px"
[rows.options]
version = "paq8px v217, -8LT"
cwd = "{work}"
compress = ["{paq8px}", "-8LT", "{in}", "{out}"]
decompress = ["{paq8px}", "-d", "{in}", "{out}"]
memory_mb = 2300
memory_words = ["memory", "alloc"]
