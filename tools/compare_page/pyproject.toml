[project]
name = "hebzip-compare-page"
version = "0.1.0"
description = "Local comparison page: hebzip (fast / max / max_plus) versus the well-known compressors."
requires-python = ">=3.12"

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pyppmd", "pyppmd.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "T20", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
