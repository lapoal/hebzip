# GENERATED by `python -m hebzip.ops.config_subset` from config/hebzip.toml - do not edit by hand;
# change the real config (or the --set rows of the build) and generate again.
# hebzip.toml - the one settings file of the tool. Unknown field anywhere = refuses to start.
# Every number of the heart is a row here; a drawer is chosen by a word ("kind" / the drawer rows).
# Relative paths are measured from the project folder (the folder that holds hebzip/ and tables/).
# Several languages live in one file: every model mode names its language pack (row "language").
# A table with a [tables.<name>.recipe] can be rebuilt from a corpus by `python -m hebzip.ops.build_langpack`;
# a table without one was given (copied in) and is only read.
# squash_knots (every template mode) = samples of the logistic function, made by `python -m hebzip.ops.knots`
# (formula and rounding: hebzip/ops/knots.py; tests/ops/test_knots.py checks every row against it).

[hebzip]
format_version = 1
default_mode = "fast"
fallback = []  # set by the build
fallback_policy = "on_error"  # set by the build
verify_roundtrip = false  # set by the build
integrity = "none"               # "none" | "crc8" | "crc16"
engine = "python"  # set by the build
holes = "null"
signature_cache = ""  # set by the build
material_dir = "golden"          # the ONE folder that may hold text (the pinned test material);
                                 # everywhere else only numbers, names and hashes - tests/gates/test_canary.py checks
table_store = "eager"  # set by the build
                                 # eager = the pinned files below, read whole; mmap = their derived copy
                                 # (raw narrowed .npy, memory-mapped; make it first with
                                 # `python -m hebzip.ops.convert_tables`); null = no tables. Same bytes.
table_store_dir = "tables/mmap"  # the derived copy + manifest.json (machine, not material)
narrow_bits = [8, 16, 32, 64]    # integer widths the derived copy may use; a value fitting none = refused
max_input_bytes = 50000000
max_output_bytes = 200000000
phantom_bits_max = 1024          # damaged-package bound: zero bits a decoder may read past the body
log_level = "INFO"

