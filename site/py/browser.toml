word_coder = "direct"            # "direct" | "spelled"
table_scale_bits = 60            # word coding table: weights sum to about 2**60
channels = ["corpus_pairs", "text_pairs", "text_counts"]   # mixer channel order = float summation order

[modes.fast.gap]
kind = "none"                    # "punctuation" | "none" (fast reads no gap)

