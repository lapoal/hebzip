[project]
name = "hebzip"
version = "0.5.0"
description = "Lossless compression for short Hebrew and English texts, with shipped word tables"
license = "MIT"
authors = [{ name = "lapoal" }]
readme = "README.md"
dependencies = ["numpy>=2.4", "numba>=0.68", "zstandard>=0.25", "pyppmd>=1.3"]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["hebzip*"]

[project.scripts]
hebzip = "hebzip.interface.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hebzip"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "golden", "tests/_work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
