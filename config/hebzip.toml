# hebzip.toml - the one settings file of the tool. Unknown field anywhere = refuses to start.
# Every number of the heart is a row here; a drawer is chosen by a word ("kind" / the drawer rows).
# Relative paths are measured from the project folder (the folder that holds hebzip/ and tables/).
# Several languages live in one file: every model mode names its language pack (row "language").
# A table with a [tables.<name>.recipe] can be rebuilt from a corpus by `python -m hebzip.ops.build_langpack`;
# a table without one was given (copied in) and is only read.
# squash_knots (every template mode) = samples of the logistic function, made by `python -m hebzip.ops.knots`
# (formula and rounding: hebzip/ops/knots.py; tests/ops/test_knots.py checks every row against it).

[hebzip]
format_version = 1
default_mode = "fast"
fallback = ["generic"]
fallback_policy = "smaller"      # "smaller" | "on_error"
verify_roundtrip = true
integrity = "none"               # "none" | "crc8" | "crc16"
engine = "numba"                 # "python" | "numba" - the same kernels, compiled or not; same bytes
holes = "null"
signature_cache = ".cache/table_sigs.json"
material_dir = "golden"          # the ONE folder that may hold text (the pinned test material);
                                 # everywhere else only numbers, names and hashes - tests/gates/test_canary.py checks
table_store = "mmap"             # "eager" | "mmap" | "null" - where the tables come from:
                                 # eager = the pinned files below, read whole; mmap = their derived copy
                                 # (raw narrowed .npy, memory-mapped; make it first with
                                 # `python -m hebzip.ops.convert_tables`); null = no tables. Same bytes.
table_store_dir = "tables/mmap"  # the derived copy + manifest.json (machine, not material)
narrow_bits = [8, 16, 32, 64]    # integer widths the derived copy may use; a value fitting none = refused
max_input_bytes = 50000000
max_output_bytes = 200000000
phantom_bits_max = 1024          # damaged-package bound: zero bits a decoder may read past the body
log_level = "INFO"

# ---------------------------------------------------------------- tables (pinned by sha256)
[tables.he_words]
path = "tables/he_words.txt"
sha256 = "9d326917ccdcce714a99af47d2d7e963358b41c1c4ec1722f5c4bbc23151f63a"
bytes = 18206852

[tables.bigram_mc1]
path = "tables/bigram_mc1.npz"
sha256 = "1f380ab97e33a5381bf29f5b860cff76cee52e69a25cec18e606f342b854f0d8"
bytes = 5462790

[tables.bigram_mc1.recipe]                          # word counts + the next word after each word
kind = "word_pairs"
held_every = 40

[tables.template_m128]
path = "tables/template_m128.npz"
sha256 = "11fe8426149845c19f8761c3c7379b6c772397d45c6940f90fd169c605d18b9e"
bytes = 1645384

[tables.template_m128.recipe]                       # static context counts of the template bytes
kind = "template_prior"
held_every = 40                  # every 40th corpus article is held out (never counted)
min_count = 128                  # a context key enters the table when seen this often
count_levels = [2, 4, 16, 64]    # confidence level of an entry = how many of these its count reaches

[tables.template_m128_weights]
path = "tables/template_m128_weights.json"
sha256 = "c329bda5fe71ac44790654e5228d10b52d7a70d9677dc4a8a00890939a818ad7"
bytes = 1679

[tables.template_m128_weights.recipe]               # fitted with the real model (domain/template_fit.py)
kind = "template_weights"
held_every = 40                  # fitted on every second held-out article ...
fit_cut = 400                    # ... cut to its first 400 template bytes (short messages)
fit_passes = 1
start_weight = 16384             # every weight starts at 1/4 (16.16 fixed point)

[tables.corpus_gap_starts]                          # mode max: corpus first words per gap class
path = "tables/corpus_gap_starts.npz"
sha256 = "26fb23828715ea846c3f0e795c366af7280f5e5d1a71da9ecc55efa6a06300d5"
bytes = 80088

[tables.corpus_gap_starts.recipe]
kind = "gap_starts"
held_every = 40
keep_top = 4000                  # the most frequent first words kept per gap class

[tables.prefix_classes]                             # mode max: proclitic class of every word id
path = "tables/prefix_classes.npy"
sha256 = "d7c8e4932793822fafee2e5abd0b11831221cd9fb894c7d46edc17b795147b70"
bytes = 1175800

[tables.prefix_classes.recipe]
kind = "prefix_classes"          # class 0 = no proclitic, 1 = short word, then one class per [languages].prefixes
short_len = 2                    # words this short are their own class
double_min_len = 4               # a double proclitic needs a word at least this long ...
double_first = "ו"               # ... starting with one of these, then another proclitic letter

[tables.prefix_prior]                               # mode max: class transitions [prev class][gap group][class]
path = "tables/prefix_prior.npy"
sha256 = "fb860158b87309d8a8b41cd1263f6263bf15a853d17059795c50a1925a8a6355"
bytes = 6656

[tables.prefix_prior.recipe]
kind = "prefix_prior"
held_every = 40

[tables.trie_he]                                    # mode max: the dictionary in alphabetical order
path = "tables/trie_he.npz"
sha256 = "2a73bbc634aa7cec1998d2f5e77a2d1fecdde8e76fc432ba7d11cb774c689f1f"
bytes = 37622006

[tables.trie_he.recipe]
kind = "letter_trie"
columns = 24                     # letters kept per word in the table (deeper ones: found by search)

[tables.letters_v15]                                # mode max: corpus letter chains (cross / within)
path = "tables/letters_v15.npz"
sha256 = "67826ee95b35c1995ca09f8ef203bec39ab706602007fa79f9845ec727e9db78"
bytes = 18520619

[tables.letters_v15.recipe]
kind = "letter_chains"
held_every = 40

[tables.letter_start_sets]                          # mode max: pretrained start weights of the letter mixer
path = "tables/letter_start_sets.json"
sha256 = "77018324df5085d8bd4ef828e80342971ffa1d5d946a60a8f806ffd645fce05b"
bytes = 2806

# ---------------------------------------------------------------- language pack
[languages.he]
letters = [[0x05D0, 0x05EA]]                        # alef .. tav
marks = [[0x0591, 0x05BD], [0x05BF, 0x05BF], [0x05C1, 0x05C2], [0x05C4, 0x05C5], [0x05C7, 0x05C7]]
word_list = "he_words"                              # word id = line number
slot_plain = 0xFF                                   # template codes: never valid UTF-8
slot_marked = 0xFE
mark_separator = 0xFC
marked_end = 0xFD
sentence_end = [".", "!", "?", "\n", "׃"]           # gap class "sentence start" (mode max)
prefixes = "והבכלמש"                                # the proclitic letters: read by the recipe of prefix_classes
gap_space = " \t\r\u00A0"                         # stripped from the end of a gap before its last character is read
gap_marks = [",;", ":", "\"'׳״“”„‘’«»", "()[]{}", "-–—־"]   # gap classes 2..6: comma-like, colon, quotes, brackets, dashes

# ---------------------------------------------------------------- mode fast
[modes.fast]
id = 1
kind = "model"
language = "he"                  # a [languages.*] pack
dictionary = "word_list"         # "word_list" | "null"
tokenizer = "overlay"            # "overlay" | "literal"
word_model = "mixture"           # "mixture" | "null"
word_coder = "direct"            # "direct" | "spelled"
table_scale_bits = 60            # word coding table: weights sum to about 2**60
channels = ["corpus_pairs", "text_pairs", "text_counts"]   # mixer channel order = float summation order

[modes.fast.gap]
kind = "none"                    # "punctuation" | "none" (fast reads no gap)

[modes.fast.template]
kind = "cm"                      # "cm" | "flat"
prob_bits = 12                   # template-bit probabilities: 12-bit integers (1..4095 of 4096)
fix_bits = 16                    # mixer weights 16.16, adaptive probabilities 16-bit
table = "template_m128"
weights = "template_m128_weights"
orders = [0, 1, 2, 3, 4, 6, 8]
adaptive = [1, 2, 3, 4, 6]
word_context = true
word_distance_cap = 3
word_seed_order = 15
static_scale = 16
conf_level = 2
learning_rate = 12
count_limit = 60
adaptive_start = 32768
adaptive_min = 32
adaptive_max = 65503
adaptive_recip_offset2 = 3       # adaptive rate = 1 / (count + 3/2)
bias_input = 256
weight_max = 1099511627776       # 2**40: both engines stop alike beyond it
hash_mul = 0x2F0B3A49
c0_mul = 0x9E3779B1
seed_mul = 0x9E3779B1
seed_add = 0x7F4A7C15
finish_mul = 0x85EBCA6B
finish_shift1 = 16               # the hash's two xor-shifts (murmur-style finish)
finish_shift2 = 13
squash_knots = [1, 2, 4, 6, 10, 17, 27, 45, 74, 120, 194, 311, 488, 747, 1102, 1546, 2048, 2550, 2994,
                3349, 3608, 3785, 3902, 3976, 4022, 4051, 4069, 4079, 4086, 4090, 4092, 4094, 4095]

[modes.fast.base]
kind = "unigram_zipf"            # "unigram_zipf" | "uniform"
table = "bigram_mc1"
zeta = 0.3333333333333333
u_scale_bits = 40
zipf_weight_bits = 40
zipf_offset = 10

[modes.fast.mixer]
kind = "trust"                   # "trust" | "static"
eta = 0.06623160779297654
alpha = 0.0066231607792976545

[modes.fast.predictors.corpus_pairs]
kind = "corpus_pairs"            # every predictor: its kind | "null"
table = "bigram_mc1"
discount = 0.8522727272727273
trust0 = 1.0

[modes.fast.predictors.text_pairs]
kind = "text_pairs"
confidence_k = 1.3815625984855935
trust0 = 0.6749999999999999

[modes.fast.predictors.text_counts]
kind = "text_counts"
confidence_k = 96.73971047973636
trust0 = 1.1540195341848232

