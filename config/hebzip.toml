bytes = 13

[tables.toy_letter_sets.recipe]
kind = "letter_start_sets"

# ---------------------------------------------------------------- language pack
[languages.latin_toy]
letters = [[0x41, 0x5A], [0x61, 0x7A]]              # A..Z, a..z
marks = [[0x0300, 0x036F]]                          # combining accents (e + U+0301 = e with acute)
word_list = "toy_words"
slot_plain = 0xFF
slot_marked = 0xFE
mark_separator = 0xFC
marked_end = 0xFD
sentence_end = [".", "!", "?", "\n"]
prefixes = ""                                       # no proclitic letters in this language
gap_space = " \t\r "
gap_marks = [",;", ":", "\"'", "()[]{}", "-"]       # gap classes 2..6

