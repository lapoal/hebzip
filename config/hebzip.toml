# ================================================================ max_plus: max + word classes + a topic channel
# Two more word channels from the word's CLASS (k-means classes of fastText vectors; the class of the word 1 / 2
# back predicts the next word, counted on Wikipedia), trust vectors selected per situation, and a TOPIC channel
# (the fastText neighbours of the text's recent content words). Numbers were tuned on held-out Wikipedia
# articles, never on the test texts. Every part is a drawer with its plate.
[tables.word_classes]                               # a word class 0..511 per word id (fastText k-means)
path = "tables/classes/word_classes_512.npy"
sha256 = "fd0065b60741f05647ecd4552009c21485bfa53c8f32459de0da40afb25fac9f"
bytes = 9405504

[tables.word_classes.recipe]                        # needs --vectors <fastText vectors, float16 .npy>
kind = "word_classes"
classes = 512
fit_words = 200000               # the centroids are fitted on the most frequent words only
iterations = 25
seed = 12345

[tables.class_pairs_wiki]                           # class of the word 1 / 2 back -> next word (Wikipedia)
