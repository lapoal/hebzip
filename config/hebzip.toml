#     python -m hebzip.ops.build_langpack --language latin_toy --corpus langpacks\latin_toy\corpus.txt
# (the tool prints the sha256/bytes rows below). Use it with:  python -m hebzip compress --mode latin_fast ...
# Differences from the Hebrew pack are rows: letters A-Z a-z, combining accents as marks, Latin punctuation
# in the gap classes, fewer template orders, and the Hebrew-only drawer prefix_class switched to its plate.
# ---------------------------------------------------------------- tables (pinned by sha256)
[tables.toy_words]
path = "tables/latin_toy/words.txt"
sha256 = "d8797370a36c2ce0ed598044fec8b0c6d1738713f4b91f02229796e0c48d724c"
bytes = 2174

[tables.toy_words.recipe]
kind = "corpus_words"
held_every = 0                   # 0 = no line held out

[tables.toy_bigram]
path = "tables/latin_toy/bigram.npz"
sha256 = "e9cef222e56e3cf0d0b29efc3e11f7cb56444cd017c02d27c545f5d80aaea794"
bytes = 24938

[tables.toy_bigram.recipe]
kind = "word_pairs"
held_every = 0

[tables.toy_template]
path = "tables/latin_toy/template.npz"
sha256 = "74f5d87919bbd34466d1887b82c12d7a1101d8300ea6acd4170ae02c308b5cc2"
bytes = 18556

[tables.toy_template.recipe]
kind = "template_prior"
held_every = 4                   # every 4th corpus line is held out (for the weights below)
min_count = 2
count_levels = [2, 4, 16, 64]

[tables.toy_template_weights]
path = "tables/latin_toy/template_weights.json"
sha256 = "904206bc08aa19327a1977e14d417214584c8adc5ef3fd85e0e0d7f034aac121"
